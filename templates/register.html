<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px auto; max-width: 420px; padding: 0 16px; }
        h1 { font-size: 1.6em; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
        .message { margin-top: 16px; min-height: 1.2em; }
        .error { color: #b00020; }
        .success { color: #1b5e20; }
        nav { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Create an account</h1>

    <form id="register-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" minlength="3" maxlength="50">

        <label for="email">Email</label>
        <input id="email" name="email" type="email">

        <label for="password">Password</label>
        <input id="password" name="password" type="password">

        <label for="confirm-password">Confirm password (optional)</label>
        <input id="confirm-password" name="confirm-password" type="password">

        <button id="register-button" type="submit">Register</button>
    </form>

    <div id="message" class="message" role="status"></div>

    <nav>
        <a href="/login.html">Already have an account? Log in</a>
    </nav>

    <script>
        const form = document.getElementById('register-form');
        const message = document.getElementById('message');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        function isValidEmail(value) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Client-side checks run before anything is sent to the server
            if (username.length < 3) {
                showMessage('Username must be at least 3 characters.', 'error');
                return;
            }
            if (!isValidEmail(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }
            if (password.length < 8) {
                showMessage('Password must be at least 8 characters.', 'error');
                return;
            }
            if (confirmPassword !== '' && confirmPassword !== password) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password }),
                });
                const data = await response.json();

                if (response.status === 201) {
                    // Keep the token so later requests can prove who the user is
                    localStorage.setItem('access_token', data.access_token);
                    showMessage('Registration successful. You are now signed in.', 'success');
                } else {
                    showMessage(data.error || 'Registration failed.', 'error');
                }
            } catch (err) {
                showMessage('Could not reach the server. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
