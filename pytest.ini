# pytest.ini
[pytest]
# Where the tests live
testpaths = tests

# Make the project folder importable, so tests can import main and app
pythonpath = .

# Coverage report for the app package and main.py, in the terminal and as HTML
addopts = --cov=app --cov=main --cov-report=term-missing --cov-report=html

# Test file, class, and function naming rules
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for the different kinds of tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast (deselect with '-m "not fast"')
    e2e: marks tests as end-to-end (select with '-m "e2e"')

# Keep the output readable
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning